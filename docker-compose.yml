version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: club-postgres-db
    environment:
      POSTGRES_DB: gestion_club_db
      POSTGRES_USER: club_admin
      POSTGRES_PASSWORD: admin_password_secure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - club-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club_admin -d gestion_club_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  spring-backend:
    build: .
    container_name: club-spring-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/gestion_club_db
      SPRING_DATASOURCE_USERNAME: club_admin
      SPRING_DATASOURCE_PASSWORD: admin_password_secure
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      JWT_SECRET: "c3VwZXItc2VjcmV0LWtleS1mb3ItY2x1Yi1tYW5hZ2VtZW50LXN5c3RlbS1iYWNrZW5kLXByb2plY3Q="
      JWT_EXPIRATION: "43200000"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - club-network

volumes:
  postgres_data:

networks:
  club-network:
    driver: bridge
