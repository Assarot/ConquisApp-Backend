spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestion_club_db}
    username: ${SPRING_DATASOURCE_USERNAME:club_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin_password_secure}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItY2x1Yi1tYW5hZ2VtZW50LXN5c3RlbS1iYWNrZW5kLXByb2plY3Q=}
    expiration-ms: ${JWT_EXPIRATION:43200000} # 12 hours by default

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
